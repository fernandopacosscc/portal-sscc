<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal Docente SSCC</title>

  <!-- Aspecto de app: icono del cole en móvil y ordenador -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1B5FAE">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Portal SSCC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root{--azul:#1B5FAE;--azul-osc:#0E3F7E;--azul-claro:#3D8BDB;--rojo:#A3191F;--rojo-osc:#7A1016}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;text-align:center;padding:24px;position:relative;
      background:linear-gradient(160deg,var(--azul-claro) 0%,var(--azul) 45%,var(--azul-osc) 100%)}
    body::after{content:'';position:fixed;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--rojo-osc),var(--rojo) 50%,var(--rojo-osc))}
    .logo{width:150px;height:150px;border-radius:32px;background:#fff;display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25)}
    .logo img{width:88%;height:auto}
    h1{font-size:26px;font-weight:800}
    p{font-size:15px;opacity:.9;max-width:320px;line-height:1.4}
    .spinner{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:g .9s linear infinite}
    @keyframes g{to{transform:rotate(360deg)}}
    .btn{display:none;background:#fff;color:var(--azul);font-weight:800;text-decoration:none;padding:15px 30px;border-radius:14px;font-size:17px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
  </style>
</head>
<body>
  <div class="logo"><img src="icono-512.png" alt="Logo Colegio Sagrados Corazones"></div>
  <h1>Portal Docente</h1>
  <div class="spinner"></div>
  <p>Abriendo el portal…</p>
  <!-- Botón oculto: solo aparece si a los 8 s el portal no se ha abierto -->
  <a class="btn" id="btn" href="https://script.google.com/a/macros/sagradoscorazones.es/s/AKfycbxqaPWXX4VH-CRLVShuNmazmTCVACFiVkTMhPTCo4XxPKFeZqDKxyLdhiwZWzEbLjakDQ/exec">Entrar al portal</a>

  <script>
    // Abre el portal automáticamente al segundo. El enlace es el del botón de arriba.
    setTimeout(function () {
      window.location.replace(document.getElementById('btn').href);
    }, 900);

    // Red de seguridad invisible: solo si algo falla, a los 8 s aparece el botón
    setTimeout(function () { document.getElementById('btn').style.display = 'inline-block'; }, 8000);

    // Limpia cualquier versión vieja que el móvil tuviera guardada
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
    if (window.caches) {
      caches.keys().then(function (k) { k.forEach(function (n) { caches.delete(n); }); }).catch(function () {});
    }
  </script>
</body>
</html>
