<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal Docente SSCC</title>

  <!-- Aspecto de app: icono del cole en móvil y ordenador -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1B5FAE">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Portal SSCC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script>
    /* ============================================================
       ÚNICO DATO QUE TIENES QUE CAMBIAR:
       pega aquí el enlace /exec de tu Portal Docente (Apps Script)
       ============================================================ */
    var PORTAL_URL = 'https://script.google.com/a/macros/sagradoscorazones.es/s/AKfycbxqaPWXX4VH-CRLVShuNmazmTCVACFiVkTMhPTCo4XxPKFeZqDKxyLdhiwZWzEbLjakDQ/exec';
  </script>

  <style>
    :root{--azul:#1B5FAE;--azul-osc:#0E3F7E;--azul-claro:#3D8BDB;--rojo:#A3191F;--rojo-osc:#7A1016}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:var(--azul-osc);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
    #portal{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F3F6FA;opacity:0;transition:opacity .35s}
    #portal.visible{opacity:1}
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;text-align:center;padding:24px;
      background:linear-gradient(160deg,var(--azul-claro) 0%,var(--azul) 45%,var(--azul-osc) 100%);transition:opacity .35s}
    #splash.oculto{opacity:0;pointer-events:none}
    #splash::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--rojo-osc),var(--rojo) 50%,var(--rojo-osc))}
    .logo{width:150px;height:118px;border-radius:28px;background:#fff;display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25)}
    .logo img{width:84%;height:auto}
    h1{font-size:26px;font-weight:800;letter-spacing:.2px}
    p{font-size:15px;opacity:.9;max-width:320px;line-height:1.4}
    .spinner{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:g 0.9s linear infinite}
    @keyframes g{to{transform:rotate(360deg)}}
    .btn{display:none;margin-top:6px;background:#fff;color:var(--azul);font-weight:800;text-decoration:none;padding:14px 26px;border-radius:14px;font-size:16px}
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo"><img src="icono-512.png" alt="Logo Colegio Sagrados Corazones"></div>
    <h1>Portal Docente</h1>
    <div class="spinner" id="spinner"></div>
    <p id="msg">Entrando…</p>
    <a class="btn" id="btn" href="#">Abrir el portal</a>
  </div>
  <iframe id="portal" title="Portal Docente SSCC" allow="clipboard-write"></iframe>

  <script>
  (function () {
    var splash = document.getElementById('splash');
    var frame = document.getElementById('portal');
    var msg = document.getElementById('msg');
    var btn = document.getElementById('btn');
    var listo = false;

    if (PORTAL_URL.indexOf('https://') !== 0) {
      document.getElementById('spinner').style.display = 'none';
      msg.textContent = 'Falta configurar el enlace del portal en index.html (PORTAL_URL).';
      return;
    }
    btn.href = PORTAL_URL;

    function abrirDirecto() {
      if (listo) return;
      msg.textContent = 'Abriendo el portal…';
      btn.style.display = 'inline-block';
      window.location.replace(PORTAL_URL);
    }

    // iPhone / iPad: Safari bloquea el inicio de sesión de Google dentro de marcos → directo
    var esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (esIOS) { abrirDirecto(); return; }

    // Resto (Android, Windows, Mac, Chromebook): portal dentro de la app
    window.addEventListener('message', function (e) {
      var host = '';
      try { host = new URL(e.origin).hostname; } catch (err) {}
      if (e.data === 'portal-sscc-listo' && /(\.googleusercontent\.com|script\.google\.com)$/.test(host)) {
        listo = true;
        frame.classList.add('visible');
        splash.classList.add('oculto');
      }
    });
    frame.src = PORTAL_URL;

    // Si en 12 s el portal no ha respondido (sesión no iniciada, bloqueo…) → abrir directo
    setTimeout(abrirDirecto, 12000);
  })();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  </script>
</body>
</html>
