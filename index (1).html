<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portal Docente SSCC</title>

  <!-- Aspecto de app: icono del cole en móvil y ordenador -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1B5FAE">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Portal SSCC">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script>
    /* ============================================================
       ÚNICO DATO QUE TIENES QUE CAMBIAR:
       pega aquí el enlace /exec de tu Portal Docente (Apps Script)
       ============================================================ */
    var PORTAL_URL = 'https://script.google.com/a/macros/sagradoscorazones.es/s/AKfycbxqaPWXX4VH-CRLVShuNmazmTCVACFiVkTMhPTCo4XxPKFeZqDKxyLdhiwZWzEbLjakDQ/exec';
  </script>

  <style>
    :root{--azul:#1B5FAE;--azul-osc:#0E3F7E;--azul-claro:#3D8BDB;--rojo:#A3191F;--rojo-osc:#7A1016}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;background:#F3F6FA;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
    /* El portal está SIEMPRE visible debajo; la bienvenida va encima y se elimina.
       (Antes estaba transparente y algunos Android no lo pintaban hasta tocar la pantalla.) */
    #portal{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F3F6FA;z-index:1}
    #splash{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;text-align:center;padding:24px;
      background:linear-gradient(160deg,var(--azul-claro) 0%,var(--azul) 45%,var(--azul-osc) 100%)}
    #splash::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--rojo-osc),var(--rojo) 50%,var(--rojo-osc))}
    .logo{width:150px;height:150px;border-radius:32px;background:#fff;display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25)}
    .logo img{width:88%;height:auto}
    h1{font-size:26px;font-weight:800;letter-spacing:.2px}
    p{font-size:15px;opacity:.9;max-width:320px;line-height:1.4}
    .spinner{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:g 0.9s linear infinite}
    @keyframes g{to{transform:rotate(360deg)}}
    .btn{display:none;margin-top:6px;background:#fff;color:var(--azul);font-weight:800;text-decoration:none;padding:14px 26px;border-radius:14px;font-size:16px}
    #debug{position:fixed;left:8px;right:8px;bottom:8px;z-index:3;max-height:40%;overflow:auto;background:rgba(0,0,0,.82);color:#7CFC9A;font:12px/1.4 monospace;padding:8px 10px;border-radius:10px;white-space:pre-wrap}
  </style>
</head>
<body>
  <iframe id="portal" title="Portal Docente SSCC" allow="clipboard-write"></iframe>
  <div id="splash">
    <div class="logo"><img src="icono-512.png" alt="Logo Colegio Sagrados Corazones"></div>
    <h1>Portal Docente</h1>
    <div class="spinner" id="spinner"></div>
    <p id="msg">Entrando…</p>
    <a class="btn" id="btn" href="#">Abrir el portal</a>
  </div>

  <script>
  (function () {
    var splash = document.getElementById('splash');
    var frame = document.getElementById('portal');
    var msg = document.getElementById('msg');
    var btn = document.getElementById('btn');
    var listo = false, cargado = false, t0 = Date.now();

    /* ---- Modo diagnóstico: abre el enlace con ?debug=1 al final ---- */
    var DEBUG = /[?&]debug=1/.test(location.search), caja = null;
    function log(t) {
      if (!DEBUG) return;
      if (!caja) { caja = document.createElement('div'); caja.id = 'debug'; document.body.appendChild(caja); }
      caja.textContent += ((Date.now() - t0) / 1000).toFixed(1) + ' s · ' + t + '\n';
    }
    log('Inicio · ' + navigator.userAgent.replace(/^Mozilla\/5\.0 /, ''));

    if (PORTAL_URL.indexOf('https://') !== 0) {
      document.getElementById('spinner').style.display = 'none';
      msg.textContent = 'Falta configurar el enlace del portal en index.html (PORTAL_URL).';
      return;
    }
    btn.href = PORTAL_URL;

    function mostrarPortal(motivo) {
      if (listo) return;
      listo = true;
      log('Mostrar portal (' + motivo + ')');
      if (splash.parentNode) splash.parentNode.removeChild(splash);
      // Empujón para que el móvil repinte el portal sin necesidad de tocar la pantalla
      frame.style.transform = 'translateZ(0)';
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          frame.style.transform = '';
          window.scrollTo(0, 0);
          try { window.dispatchEvent(new Event('resize')); } catch (e) {}
        });
      });
      setTimeout(function () { frame.style.opacity = '0.999'; }, 50);
      setTimeout(function () { frame.style.opacity = ''; }, 120);
      try { frame.focus(); } catch (e) {}
    }

    function abrirDirecto(motivo) {
      if (listo) return;
      log('Abrir directo (' + motivo + ')');
      msg.textContent = 'Abriendo el portal…';
      btn.style.display = 'inline-block';
      window.location.replace(PORTAL_URL);
    }

    // iPhone / iPad: Safari bloquea el inicio de sesión de Google dentro de marcos → directo
    var esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (esIOS) { abrirDirecto('iPhone/iPad'); return; }

    // El portal avisa cuando ya ha dibujado los botones
    window.addEventListener('message', function (e) {
      var host = '';
      try { host = new URL(e.origin).hostname; } catch (err) {}
      log('Mensaje de ' + host + ': ' + e.data);
      if (e.data === 'portal-sscc-listo' && /(\.googleusercontent\.com|script\.google\.com)$/.test(host)) {
        mostrarPortal('aviso del portal');
      }
    });

    frame.addEventListener('load', function () {
      cargado = true;
      log('Marco cargado');
      // Si cargó pero el portal no avisa en 6 s → seguramente falta iniciar sesión → abrir directo
      setTimeout(function () { abrirDirecto('cargó sin aviso'); }, 6000);
    });

    frame.src = PORTAL_URL;

    // Si en 15 s ni siquiera ha cargado (sin conexión, bloqueo…) → abrir directo
    setTimeout(function () { if (!cargado) abrirDirecto('no carga'); }, 15000);

    // Al volver a la app desde segundo plano, repintar
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && listo) {
        log('Vuelve al primer plano');
        frame.style.transform = 'translateZ(0)';
        requestAnimationFrame(function () { frame.style.transform = ''; });
      }
    });
  })();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
  </script>
</body>
</html>
